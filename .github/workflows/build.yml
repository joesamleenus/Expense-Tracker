name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # This repo only stores the app's Dart code (lib/, pubspec.yaml).
      # The android/ folder is regenerated fresh every build, since it's
      # just standard boilerplate Flutter creates automatically.
      - name: Generate the Android project folder
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.joe.expensetracker .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build the APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
