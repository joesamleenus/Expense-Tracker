name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate the Android project folder
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.joe.expensetracker --project-name expense_tracker .
          fi

      - name: Grant internet permission
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Set app display name to Zaldora
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Zaldora"/' android/app/src/main/AndroidManifest.xml

      - name: Apply Zaldora app icon
        run: |
          cp -f app_icon/mipmap-mdpi/*.png android/app/src/main/res/mipmap-mdpi/
          cp -f app_icon/mipmap-hdpi/*.png android/app/src/main/res/mipmap-hdpi/
          cp -f app_icon/mipmap-xhdpi/*.png android/app/src/main/res/mipmap-xhdpi/
          cp -f app_icon/mipmap-xxhdpi/*.png android/app/src/main/res/mipmap-xxhdpi/
          cp -f app_icon/mipmap-xxxhdpi/*.png android/app/src/main/res/mipmap-xxxhdpi/

      - name: Get dependencies
        run: flutter pub get

      - name: Build the APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
